<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="code-sculpture-light-title code-sculpture-light-desc">
  <title id="code-sculpture-light-title">Hi, I'm Will.</title>
  <desc id="code-sculpture-light-desc">Will, an open-source builder focused on automation and infrastructure, introduced alongside a red code sculpture.</desc>
  <defs>
    <clipPath id="code-sculpture-light-clip">
      <rect width="1200" height="320" rx="24" />
    </clipPath>
    <linearGradient id="code-sculpture-light-red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff8fa6" />
      <stop offset=".4" stop-color="#df1734" />
      <stop offset="1" stop-color="#ab0b37" />
    </linearGradient>
    <radialGradient id="code-sculpture-light-halo">
      <stop stop-color="#df1734" stop-opacity=".14" />
      <stop offset="1" stop-color="#df1734" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
            .code-sculpture-light-float { animation:code-sculpture-light-float 9s ease-in-out infinite }
            .code-sculpture-light-trace { stroke-dasharray:48 560;animation:code-sculpture-light-trace 9s linear infinite }
            @keyframes code-sculpture-light-float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
            @keyframes code-sculpture-light-trace { to { stroke-dashoffset:-608 } }
            @media(prefers-reduced-motion:reduce) { .code-sculpture-light-float,.code-sculpture-light-trace { animation:none } }
          </style>
  <g clip-path="url(#code-sculpture-light-clip)">
    <rect width="1200" height="320" fill="#fbf8f8" />
    <ellipse cx="970" cy="163" rx="235" ry="205" fill="url(#code-sculpture-light-halo)" />
    <g class="code-sculpture-light-float">
      <g transform="rotate(-8 969 159)">
        <rect x="788" y="67" width="360" height="184" rx="24" fill="#fff0f2" stroke="#df1734" stroke-width="1" stroke-opacity=".15" />
        <path d="M874 106L816 159L874 212" transform="translate(8 12)" stroke="#20161b" stroke-opacity=".07" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M874 106L816 159L874 212" stroke="url(#code-sculpture-light-red)" stroke-width="25" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M874 106L816 159L874 212" stroke="#ffb9cb" stroke-opacity=".65" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="none" class="code-sculpture-light-trace" />
        <path d="M1062 106L1120 159L1062 212" transform="translate(8 12)" stroke="#20161b" stroke-opacity=".07" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M1062 106L1120 159L1062 212" stroke="url(#code-sculpture-light-red)" stroke-width="25" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M1062 106L1120 159L1062 212" stroke="#ffb9cb" stroke-opacity=".65" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="none" class="code-sculpture-light-trace" />
        <path d="M996 88L940 230" transform="translate(8 12)" stroke="#20161b" stroke-opacity=".07" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M996 88L940 230" stroke="url(#code-sculpture-light-red)" stroke-width="25" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        <path d="M996 88L940 230" stroke="#ffb9cb" stroke-opacity=".65" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="none" class="code-sculpture-light-trace" />
      </g>
    </g>
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="62" y="79" fill="#df1734" font-size="15" font-weight="600" letter-spacing="3">HELLO</text>
      <text x="58" y="158" fill="#20161b" font-size="66" font-weight="800" letter-spacing="-2.6">Hi, I'm Will.</text>
      <text x="62" y="211" fill="#20161b" font-size="26" font-weight="500" letter-spacing="-.35">Practical software. Fewer 3 a.m. surprises.</text>
      <text x="62" y="267" fill="#75616b" font-size="17" font-weight="500" letter-spacing=".2">Open-source builder · Automation · Infrastructure</text>
    </g>
  </g>
</svg>
